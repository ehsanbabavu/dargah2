services:
  db:
    image: postgres:15-alpine
    container_name: rakhsh-postgres-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-your_secure_db_password_here}
      POSTGRES_DB: ${POSTGRES_DB:-rakhsh_db}
    # Only bind DB port to localhost or omit ports mapping to keep DB isolated inside docker container network
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rakhsh_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rakhsh-express-app
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - app_uploads:/app/uploads
      - app_stamppic:/app/stamppic
      - app_invoices:/app/public/invoices

volumes:
  postgres_data:
    driver: local
  app_uploads:
    driver: local
  app_stamppic:
    driver: local
  app_invoices:
    driver: local
