<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" direction="rtl">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#0f362a" flood-opacity="0.16" />
    </filter>
    <linearGradient id="monsterBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5dd1ad" />
      <stop offset="100%" stop-color="#3ea887" />
    </linearGradient>
    <linearGradient id="hornGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d7e65" />
      <stop offset="100%" stop-color="#1f5d4a" />
    </linearGradient>
    <linearGradient id="btnPink" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ee4582" />
      <stop offset="100%" stop-color="#d62f6d" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#bfeee7" stroke-width="1.5" opacity="0.6"/>
    </pattern>
  </defs>

  <!-- Background Canvas -->
  <rect width="1280" height="800" fill="#D5F7F6" />
  <rect width="1280" height="800" fill="url(#grid)" />
  
  <!-- Subtle organic background blobs -->
  <circle cx="200" cy="180" r="160" fill="#C2F1ED" opacity="0.8" />
  <circle cx="1100" cy="650" r="220" fill="#C2F1ED" opacity="0.7" />

  <!-- Main Central Container Box -->
  <g transform="translate(340, 110)" filter="url(#shadow)">
    <!-- Container frame -->
    <rect width="600" height="580" rx="24" fill="#E8FAF8" stroke="#54BC9B" stroke-width="3" />

    <!-- Monster Top Section -->
    <g transform="translate(300, 210)">
      <!-- Horns -->
      <path d="M -70 -130 Q -85 -180 -120 -195 Q -100 -150 -60 -115 Z" fill="url(#hornGrad)" />
      <path d="M 70 -130 Q 85 -180 120 -195 Q 100 -150 60 -115 Z" fill="url(#hornGrad)" />

      <!-- Monster Arms -->
      <path d="M -110 -20 Q -150 0 -130 50 Q -110 30 -90 10 Z" fill="url(#monsterBody)" opacity="0.95" />
      <path d="M 110 -20 Q 150 0 130 50 Q 110 30 90 10 Z" fill="url(#monsterBody)" opacity="0.95" />

      <!-- Monster Main Body -->
      <rect x="-105" y="-140" width="210" height="230" rx="75" fill="url(#monsterBody)" />

      <!-- Eyes Background / Shadows -->
      <ellipse cx="-42" cy="-75" rx="34" ry="34" fill="#308269" opacity="0.4" />
      <ellipse cx="42" cy="-75" rx="34" ry="34" fill="#308269" opacity="0.4" />

      <!-- Left Eye -->
      <ellipse cx="-42" cy="-80" rx="30" ry="30" fill="#FFFFFF" />
      <circle cx="-38" cy="-80" r="14" fill="#202b38" />
      <circle cx="-33" cy="-85" r="5" fill="#FFFFFF" />

      <!-- Right Eye -->
      <ellipse cx="42" cy="-80" rx="30" ry="30" fill="#FFFFFF" />
      <circle cx="46" cy="-80" r="14" fill="#202b38" />
      <circle cx="51" cy="-85" r="5" fill="#FFFFFF" />

      <!-- Mouth -->
      <path d="M -45 -20 Q 0 35 45 -20 Z" fill="#782337" />
      <path d="M -40 -20 Q 0 25 40 -20 Z" fill="#9e2a44" />
      <!-- Teeth -->
      <path d="M -24 -20 L -18 -8 L -12 -20 Z" fill="#FFFFFF" />
      <path d="M 12 -20 L 18 -8 L 24 -20 Z" fill="#FFFFFF" />
    </g>

    <!-- White Bottom Card Holder -->
    <g transform="translate(20, 270)">
      <rect width="560" height="290" rx="16" fill="#FFFFFF" stroke="#54BC9B" stroke-width="2" />

      <!-- Inner Text Content -->
      <g transform="translate(280, 25)" text-anchor="middle">
        <!-- 404 Header Number -->
        <text y="55" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="900" fill="#2c3e50" letter-spacing="2">404</text>

        <!-- Yellow highlight badge banner -->
        <g transform="translate(0, 80)">
          <rect x="-180" y="0" width="360" height="42" rx="21" fill="#F6BA3F" stroke="#FDE5A9" stroke-width="2" />
          <text y="27" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#FFFFFF">اوه ... شاید ... مشکلی پیش اومده باشه</text>
        </g>

        <!-- Subtitle message -->
        <text y="155" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#64748b">متاسفانه صفحه مورد نظر پیدا نشد !</text>

        <!-- Return Home Pink Pill Button -->
        <g transform="translate(0, 180)">
          <rect x="-120" y="0" width="240" height="46" rx="23" fill="url(#btnPink)" stroke="#ffffff" stroke-width="2" stroke-opacity="0.6" />
          <text y="28" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#FFFFFF">بازگشت به صفحه نخست</text>
        </g>
      </g>
    </g>
  </g>
</svg>
